<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>TerlabGift Saint-Leu - Splat Viewer (POC)</title>
<style>
  :root {
    --bg: #0e0e10;
    --panel: #1a1a1c;
    --text: #e6e3da;
    --muted: #888076;
    --accent: #d4a574;
    --hover: #2a2a2e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }
  #viewer { position: absolute; inset: 0; }
  .panel {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: var(--panel); border: 1px solid #2a2a2e;
    border-radius: 8px; padding: 14px 16px; min-width: 240px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.4);
  }
  .panel h1 { font-size: 14px; font-weight: 600; margin-bottom: 4px; letter-spacing: 0.3px; }
  .panel .sub { font-size: 11px; color: var(--muted); margin-bottom: 12px; }
  .zones { display: flex; flex-direction: column; gap: 4px; }
  .zone-btn {
    background: transparent; color: var(--text);
    border: 1px solid #2a2a2e; border-radius: 6px;
    padding: 8px 10px; font-size: 12px; text-align: left;
    cursor: pointer; transition: all 0.15s;
  }
  .zone-btn:hover { background: var(--hover); border-color: var(--accent); }
  .zone-btn.active { background: var(--accent); color: #1a1411; border-color: var(--accent); font-weight: 600; }
  .zone-btn .meta { display: block; font-size: 10px; opacity: 0.7; margin-top: 2px; }
  .stats { margin-top: 12px; padding-top: 12px; border-top: 1px solid #2a2a2e; font-size: 11px; color: var(--muted); }
  .stats div { margin: 2px 0; }
  .stats span { color: var(--text); }
  .help {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    background: var(--panel); border: 1px solid #2a2a2e;
    border-radius: 8px; padding: 10px 14px;
    font-size: 11px; color: var(--muted); line-height: 1.6;
  }
  .help kbd {
    background: #2a2a2e; color: var(--text);
    padding: 1px 6px; border-radius: 3px; font-family: monospace;
    font-size: 10px;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(14,14,16,0.9); z-index: 100; font-size: 13px; color: var(--accent);
  }
  #loading.hidden { display: none; }
  .spinner {
    border: 2px solid #2a2a2e; border-top-color: var(--accent);
    border-radius: 50%; width: 24px; height: 24px;
    animation: spin 0.8s linear infinite; margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="viewer"></div>

<div class="panel">
  <h1>TerlabGift Saint-Leu</h1>
  <div class="sub">5 zones notables - LiDAR HD IGN colorise ortho 20cm</div>
  <div class="zones" id="zones"></div>
  <div class="stats" id="stats"></div>
</div>

<div class="help">
  <kbd>L click</kbd> pivot &nbsp; <kbd>R click</kbd> pan &nbsp; <kbd>scroll</kbd> zoom<br>
  <kbd>1-5</kbd> zone &nbsp; <kbd>R</kbd> reset cam
</div>

<div id="loading"><div class="spinner"></div><span id="loading-text">Chargement...</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

const ZONES = [
  { slug: 'centre_st_leu',       name: 'Centre St-Leu',         desc: 'Bati dense cotier' },
  { slug: 'pointe_au_sel',       name: 'Pointe au Sel',         desc: 'Falaise cotiere' },
  { slug: 'plage_souris_chaude', name: 'Plage Souris Chaude',   desc: 'Front de mer' },
  { slug: 'ravine_du_cap',       name: 'Ravine du Cap',         desc: 'Ravine encaissee' },
  { slug: 'bois_de_sans_souci',  name: 'Bois de Sans-Souci',    desc: 'Foret des Hauts' },
];

let manifest = null;
fetch('../../sota/splats/_manifest.json').then(r => r.json()).then(m => { manifest = m; renderStats(); });

function renderZones() {
  const root = document.getElementById('zones');
  ZONES.forEach((z, i) => {
    const btn = document.createElement('button');
    btn.className = 'zone-btn';
    btn.dataset.slug = z.slug;
    btn.innerHTML = `<strong>${i+1}.</strong> ${z.name}<span class="meta">${z.desc}</span>`;
    btn.onclick = () => loadZone(z.slug);
    root.appendChild(btn);
  });
}

function renderStats(zoneSlug) {
  const root = document.getElementById('stats');
  if (!manifest) { root.innerHTML = ''; return; }
  if (!zoneSlug) {
    const total = manifest.reduce((s, r) => s + (r.size_mb || 0), 0);
    const totalSplats = manifest.reduce((s, r) => s + (r.n_splats || 0), 0);
    root.innerHTML = `<div>Total : <span>${(total).toFixed(1)} MB</span></div>
                       <div>Splats : <span>${totalSplats.toLocaleString()}</span></div>
                       <div>Zones : <span>${manifest.length}</span></div>`;
    return;
  }
  const z = manifest.find(r => r.slug === zoneSlug);
  if (!z) return;
  root.innerHTML = `
    <div>Splats : <span>${z.n_splats.toLocaleString()}</span></div>
    <div>Taille : <span>${z.size_mb} MB</span></div>
    <div>Centre : <span>${z.lat_c}, ${z.lng_c}</span></div>
    <div>Cote : <span>${z.side_m} m</span></div>
    <div>Z min : <span>${z.z_min_alt} m alt</span></div>
  `;
}

let viewer = null;
let currentZone = null;

async function initViewer() {
  viewer = new GaussianSplats3D.Viewer({
    'cameraUp': [0, 1, 0],
    'initialCameraPosition': [0, 80, 200],
    'initialCameraLookAt': [0, 20, 0],
    'rootElement': document.getElementById('viewer'),
    'sphericalHarmonicsDegree': 0,
    'sceneRevealMode': GaussianSplats3D.SceneRevealMode.Instant,
    'antialiased': true,
    'webXRMode': GaussianSplats3D.WebXRMode.None,
    // Sans COOP/COEP : transferable buffers au lieu de SharedArrayBuffer
    'sharedMemoryForWorkers': false,
    'gpuAcceleratedSort': false,
  });
}

async function loadZone(slug) {
  if (currentZone === slug) return;
  document.querySelectorAll('.zone-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.slug === slug);
  });
  showLoading(`Chargement ${slug}...`);

  try {
    if (currentZone) {
      await viewer.removeSplatScene(0, false);
    }
    await viewer.addSplatScene(`../../sota/splats/${slug}.splat`, {
      'splatAlphaRemovalThreshold': 5,
      'showLoadingUI': false,
      'position': [0, 0, 0],
      'rotation': [0, 0, 0, 1],
      'scale': [1, 1, 1],
    });
    if (!viewer.isLoadingOrUnloading()) {
      viewer.start();
    }
    currentZone = slug;
    renderStats(slug);
  } catch (e) {
    console.error(e);
    document.getElementById('loading-text').textContent = `Erreur : ${e.message}`;
    return;
  }

  hideLoading();
}

function showLoading(t) {
  document.getElementById('loading-text').textContent = t;
  document.getElementById('loading').classList.remove('hidden');
}
function hideLoading() {
  document.getElementById('loading').classList.add('hidden');
}

document.addEventListener('keydown', (e) => {
  const idx = parseInt(e.key) - 1;
  if (idx >= 0 && idx < ZONES.length) loadZone(ZONES[idx].slug);
  if (e.key === 'r' || e.key === 'R') {
    if (viewer) viewer.controls.reset();
  }
});

renderZones();
initViewer().then(() => loadZone(ZONES[0].slug));
</script>

</body>
</html>
